<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر الإبداع | جهاز S20</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    }

    body {
      color: #0d2242;
      background:
        radial-gradient(circle at 85% 5%, #bfe3ff, transparent 45%),
        radial-gradient(circle at 5% 95%, #d9eeff, transparent 50%),
        linear-gradient(135deg, #f0f8ff 0%, #e0f0ff 50%, #f5f9ff 100%);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      height: 76px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
      background: linear-gradient(135deg, #004097, #0a5fd8 50%, #0b8ee8);
      box-shadow: 
        0 8px 32px rgba(5, 53, 110, 0.3),
        inset 0 1px 0 rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(8px);
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 0.3px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    header a {
      color: white;
      text-decoration: none;
      background: linear-gradient(135deg, #ffffff26, #ffffff10);
      border: 1px solid #ffffff55;
      padding: 9px 24px;
      border-radius: 25px;
      transition: 0.3s;
      font-weight: 700;
      font-size: 15px;
      backdrop-filter: blur(4px);
    }

    header a:hover {
      background: #ffffff33;
      border-color: white;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px #0004;
    }

    .hero {
      min-height: 540px;
      padding: 60px 7%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }

    .content h1 {
      font-size: clamp(34px, 4.2vw, 58px);
      line-height: 1.28;
      color: #052f6e;
      margin: 20px 0;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .content h1 span {
      background: linear-gradient(120deg, #0786e8, #05b8d8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    .content p {
      color: #4a6284;
      font-size: 18px;
      line-height: 1.9;
      margin-bottom: 30px;
    }

    .label {
      display: inline-block;
      color: #0658b8;
      background: linear-gradient(135deg, #e3f2ff, #d3e9ff);
      border: 1px solid #b7ddff;
      border-radius: 30px;
      padding: 8px 20px;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 16px;
      box-shadow: 0 3px 10px #0866d61a;
    }

    .btn {
      display: inline-block;
      color: white;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      padding: 15px 34px;
      border-radius: 13px;
      background: linear-gradient(135deg, #0dd06f, #08a84a);
      box-shadow: 0 10px 26px #07994344;
      transition: all 0.35s cubic-bezier(.2,.9,.3,1.4);
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 16px 34px #07994355;
      background: linear-gradient(135deg, #10e578, #09c057);
    }

    .scene-box {
      position: relative;
      height: 440px;
      overflow: hidden;
      border-radius: 26px;
      background: 
        linear-gradient(135deg, #ffffff 0%, #f8fcff 50%, #f0f8ff 100%);
      box-shadow:
        0 20px 50px rgba(12, 102, 170, 0.32),
        0 8px 16px rgba(12, 102, 170, 0.18),
        inset 0 1px 2px rgba(255,255,255,0.8),
        inset 0 -1px 2px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 40% 25%, rgba(255,255,255,0.6) 0%, transparent 50%),
        radial-gradient(circle at 60% 60%, rgba(7,134,232,0.05) 0%, transparent 40%);
      pointer-events: none;
    }

    .scene-box img {
      max-width: 78%;
      max-height: 78%;
      object-fit: contain;
      image-rendering: crisp-edges;
      filter: drop-shadow(0 16px 36px rgba(12, 102, 170, 0.28));
      position: relative;
      z-index: 1;
    }

    #scene {
      display: none;
    }

    .scene-title {
      position: absolute;
      left: 22px;
      bottom: 16px;
      direction: ltr;
      color: #0786e8;
      font-size: 11px;
      letter-spacing: 2.5px;
      font-weight: 800;
      z-index: 2;
    }

    .hint {
      position: absolute;
      right: 20px;
      top: 20px;
      color: #0658b8;
      background: linear-gradient(135deg, #ffffffee, #eaf5ffee);
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 4px 14px #0866d622;
      z-index: 2;
    }

    .features-section {
      padding: 70px 7%;
      background: linear-gradient(180deg, #ffffffcc, #ffffffee);
    }

    .section-title {
      text-align: center;
      color: #052f6e;
      font-size: 34px;
      margin-bottom: 45px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .feature {
      text-align: center;
      background: white;
      border-radius: 18px;
      padding: 30px 22px;
      box-shadow: 
        0 12px 32px rgba(8, 102, 214, 0.2),
        0 4px 8px rgba(0,0,0,0.08),
        inset 0 1px 0 rgba(255,255,255,0.6);
      border-top: 4px solid transparent;
      border-image: linear-gradient(90deg, #0786e8, #05b8d8) 1;
      transition: all 0.35s cubic-bezier(.2,.9,.3,1.2);
    }

    .feature:hover {
      transform: translateY(-8px);
      box-shadow: 
        0 20px 48px rgba(8, 102, 214, 0.3),
        0 8px 16px rgba(0,0,0,0.12);
    }

    .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: linear-gradient(145deg, #0a8ceb, #0555b0);
      box-shadow:
        0 10px 22px rgba(7,134,232,0.35),
        inset 0 2px 3px rgba(255,255,255,0.35),
        inset 0 -3px 6px rgba(0,0,0,0.15);
      position: relative;
    }

    .feature h3 {
      color: #0758aa;
      margin-bottom: 10px;
      font-size: 17px;
      font-weight: 800;
    }

    .feature p {
      color: #657b94;
      font-size: 14px;
      line-height: 1.7;
    }

    .guarantee {
      margin: 50px 7%;
      padding: 40px;
      text-align: center;
      color: white;
      border-radius: 22px;
      background: linear-gradient(135deg, #012f68, #0a5fd8 55%, #0b8ee8);
      box-shadow: 
        0 20px 50px rgba(1, 47, 104, 0.4),
        0 8px 16px rgba(0,0,0,0.12),
        inset 0 1px 0 rgba(255,255,255,0.15);
      position: relative;
      overflow: hidden;
    }

    .guarantee::before {
      content: "";
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 85% 20%, rgba(255,255,255,0.25) 0%, transparent 55%),
        radial-gradient(circle at 10% 80%, rgba(255,255,255,0.08) 0%, transparent 40%);
    }

    .guarantee h2 {
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 10px;
      position: relative;
    }

    .guarantee p {
      font-size: 16px;
      opacity: 0.95;
      position: relative;
    }

    .order {
      padding: 70px 7%;
      background: linear-gradient(160deg, #eaf5ff, #f7fbff);
    }

    .order-box {
      max-width: 620px;
      margin: auto;
      padding: 38px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 16px 45px #0866d624;
    }

    .order-box h2 {
      color: #052f6e;
      text-align: center;
      margin-bottom: 28px;
      font-size: 25px;
      font-weight: 900;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: 700;
      color: #24476c;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1.5px solid #d0e0f0;
      border-radius: 10px;
      outline: none;
      transition: all 0.3s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #0786e8;
      box-shadow: 0 0 0 3px #0786e822;
      background: #f8fcff;
    }

    select {
      font-family: inherit;
      color: #0d2242;
      background-color: white;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1L7 7L13 1' stroke='%230786e8' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: left 14px center;
      padding-left: 38px;
    }

    select:required:invalid {
      color: #8a9bb5;
    }

    select option {
      color: #0d2242;
    }

    textarea {
      min-height: 85px;
      resize: vertical;
      font-family: inherit;
    }

    .whatsapp {
      width: 100%;
      margin-top: 22px;
    }

    footer {
      padding: 30px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #052e64, #064da5);
      font-size: 14px;
    }

    footer p {
      margin: 5px 0;
    }

    .floating {
      position: fixed;
      z-index: 5;
      bottom: 24px;
      left: 24px;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: white;
      background: linear-gradient(135deg, #0bbd60, #07a84a);
      font-size: 24px;
      text-decoration: none;
      box-shadow: 0 6px 20px #0004;
      transition: all 0.3s ease;
    }

    .floating:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 28px #000a;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 30px;
        padding: 30px 7%;
        min-height: auto;
      }

      .scene-box {
        order: -1;
        height: 350px;
      }

      .content {
        text-align: center;
      }

      .content p {
        font-size: 16px;
      }

      .features {
        grid-template-columns: repeat(2, 1fr);
      }

      .content h1 {
        font-size: 32px;
      }
    }

    @media (max-width: 600px) {
      .hero {
        padding: 20px 5%;
      }

      .scene-box {
        height: 280px;
      }

      .features {
        grid-template-columns: 1fr;
      }

      .feature {
        padding: 20px 16px;
      }

      .order-box {
        padding: 24px;
        margin: 0 10px;
      }

      .guarantee {
        margin: 30px 5%;
        padding: 25px 20px;
      }

      .content h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

    <div class="logo">متجر الإبداع</div>
